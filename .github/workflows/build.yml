          mkdir -p app/src/main/java/com/walkietalk/app
          cat > app/src/main/java/com/walkietalk/app/Incoming.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.content.Context
          import android.media.AudioManager
          import android.os.Handler
          import android.os.Looper
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.QueryDocumentSnapshot

          /**
           * Bondhur call receive kora. App khola thakle (uiVisible) ba push diye jagano service cholle
           * (serviceUp) shunte thake. Dutoi na thakle bondho.
           */
          object Incoming {
              @Volatile var uiVisible = false
              @Volatile var serviceUp = false
              var onChange: ((Int) -> Unit)? = null

              private val main = Handler(Looper.getMainLooper())
              private var reg: ListenerRegistration? = null
              private val calls = HashMap<String, Call>()
              private var appCtx: Context? = null

              fun activeCount(): Int = calls.size

              private fun changed() {
                  val n = calls.size
                  main.post { onChange?.invoke(n) }
              }

              fun start(ctx: Context) {
                  if (reg != null) return
                  val app = ctx.applicationContext
                  appCtx = app
                  val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return
                  Dbg.log("shunche (uid ${uid.take(6)})")
                  reg = FirebaseFirestore.getInstance().collection("calls")
                      .whereEqualTo("to", uid)
                      .addSnapshotListener { qs, e ->
                          if (e != null) Dbg.log("listen error: ${e.message}")
                          if (qs == null) return@addSnapshotListener
                          for (ch in qs.documentChanges) {
                              val d = ch.document
                              when (ch.type) {
                                  DocumentChange.Type.ADDED ->
                                      if (d.getString("state") == "offer") handle(app, d)
                                  DocumentChange.Type.MODIFIED ->
                                      if (d.getString("state") == "ended") calls[d.id]?.close()
                                  DocumentChange.Type.REMOVED ->
                                      calls[d.id]?.close()
                              }
                          }
                      }
              }

              fun stopIfIdle() {
                  if (uiVisible || serviceUp) return
                  reg?.remove()
                  reg = null
                  calls.values.toList().forEach { it.close() }
                  Dbg.log("shunna bondho")
              }

              private fun handle(ctx: Context, d: QueryDocumentSnapshot) {
                  if (calls.containsKey(d.id)) return
                  val from = d.getString("from") ?: return
                  val code = d.getString("fromCode") ?: return
                  val offer = d.getString("offer") ?: return
                  val ts = d.getLong("ts") ?: 0L
                  if (ts > 0 && Math.abs(System.currentTimeMillis() - ts) > 5 * 60 * 1000) {
                      Dbg.log("purono offer, ignore")
                      return
                  }
                  Dbg.log("offer aslo, ID $code")
                  // shudhu approved (save kora) contact er kotha auto-play hobe
                  if (code !in Store.contacts(ctx)) { Dbg.log("$code contact e nei, ignore"); return }
                  FirebaseFirestore.getInstance().collection("ids").document(code).get()
                      .addOnSuccessListener { s ->
                          if (s.getString("uid") != from || calls.containsKey(d.id)) {
                              Dbg.log("ID check mile ni")
                              return@addOnSuccessListener
                          }
                          Dbg.log("call receive shuru")
                          val c = Call(ctx, d.reference, "callee")
                          calls[d.id] = c
                          audioOn(ctx)
                          c.onClosed = {
                              calls.remove(d.id)
                              if (calls.isEmpty()) audioOff(ctx)
                              Dbg.log("call shesh")
                              changed()
                          }
                          Rtc.ensureIce { c.startAsCallee(offer) }
                          changed()
                      }
              }

              private fun audioOn(ctx: Context) {
                  try {
                      val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.mode = AudioManager.MODE_IN_COMMUNICATION
                      am.isSpeakerphoneOn = true
                      am.setStreamVolume(
                          AudioManager.STREAM_VOICE_CALL,
                          am.getStreamMaxVolume(AudioManager.STREAM_VOICE_CALL), 0
                      )
                  } catch (_: Exception) {}
              }

              private fun audioOff(ctx: Context) {
                  try {
                      val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.isSpeakerphoneOn = false
                      am.mode = AudioManager.MODE_NORMAL
                  } catch (_: Exception) {}
              }
          }
