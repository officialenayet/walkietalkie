          cat > app/src/main/java/com/walkietalk/app/TalkButton.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.animation.ArgbEvaluator
          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.LinearInterpolator
          import android.view.animation.OvershootInterpolator

          /** Boro round talk button: pulse, spinner, slide-up-to-lock */
          class TalkButton(ctx: Context) : View(ctx) {

              enum class Mode { IDLE, CONNECTING, READY, TALKING, LOCKED }

              interface Listener {
                  fun onDown(): Boolean   // true hole gesture track korbo
                  fun onLock()
                  fun onUp()
              }

              var listener: Listener? = null

              companion object {
                  const val COL_IDLE = 0xFF23262F.toInt()
                  const val COL_READY = 0xFF5B6CFF.toInt()
                  const val COL_TALK = 0xFFFF5470.toInt()
                  const val COL_ACCENT = 0xFF8B97FF.toInt()
                  const val ICON_DIM = 0xFF8A8FA3.toInt()
              }

              private val dens = resources.displayMetrics.density
              private fun dp(v: Float) = v * dens

              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val rect = RectF()

              private var fillColor = COL_IDLE
              private var iconColor = ICON_DIM
              private var spinner = 0f
              private var pulse = 0f
              private var press = 0f
              private var pill = 0f
              private var lockP = 0f
              private var tracking = false
              private var lockedHere = false
              private var downY = 0f

              private val radius get() = dp(84f)
              private val cxf get() = width / 2f
              private val cyf get() = height - radius - dp(28f)

              private val spinAnim = ValueAnimator.ofFloat(0f, 360f).apply {
                  duration = 1100
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { spinner = it.animatedValue as Float; invalidate() }
              }
              private val pulseAnim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 1500
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = DecelerateInterpolator()
                  addUpdateListener { pulse = it.animatedValue as Float; invalidate() }
              }
              private var colorAnim: ValueAnimator? = null

              var mode: Mode = Mode.IDLE
                  set(v) {
                      if (field != v) {
                          field = v
                          applyMode()
                      }
                  }

              private fun applyMode() {
                  val target = when (mode) {
                      Mode.IDLE, Mode.CONNECTING -> COL_IDLE
                      Mode.READY -> COL_READY
                      Mode.TALKING, Mode.LOCKED -> COL_TALK
                  }
                  val iconTarget = if (mode == Mode.IDLE || mode == Mode.CONNECTING) ICON_DIM else Color.WHITE
                  val fromFill = fillColor
                  val fromIcon = iconColor
                  colorAnim?.cancel()
                  colorAnim = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 260
                      addUpdateListener {
                          val f = it.animatedFraction
                          fillColor = ArgbEvaluator().evaluate(f, fromFill, target) as Int
                          iconColor = ArgbEvaluator().evaluate(f, fromIcon, iconTarget) as Int
                          invalidate()
                      }
                      start()
                  }
                  if (mode == Mode.CONNECTING) { if (!spinAnim.isStarted) spinAnim.start() } else spinAnim.cancel()
                  if (mode == Mode.TALKING || mode == Mode.LOCKED) { if (!pulseAnim.isStarted) pulseAnim.start() } else pulseAnim.cancel()
                  invalidate()
              }

              private fun animPress(down: Boolean) {
                  ValueAnimator.ofFloat(press, if (down) 1f else 0f).apply {
                      duration = 200
                      interpolator = OvershootInterpolator(2f)
                      addUpdateListener { press = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }

              private fun animPill(show: Boolean) {
                  ValueAnimator.ofFloat(pill, if (show) 1f else 0f).apply {
                      duration = 200
                      addUpdateListener { pill = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }

              private fun animLockBack() {
                  ValueAnimator.ofFloat(lockP, 0f).apply {
                      duration = 200
                      addUpdateListener { lockP = it.animatedValue as Float; invalidate() }
                      start()
                  }
              }

              override fun onDetachedFromWindow() {
                  spinAnim.cancel()
                  pulseAnim.cancel()
                  colorAnim?.cancel()
                  super.onDetachedFromWindow()
              }

              override fun onAttachedToWindow() {
                  super.onAttachedToWindow()
                  applyMode()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          val dx = e.x - cxf
                          val dy = e.y - cyf
                          val lim = radius * 1.2f
                          if (dx * dx + dy * dy > lim * lim) return false
                          parent?.requestDisallowInterceptTouchEvent(true)
                          downY = e.y
                          lockedHere = false
                          tracking = listener?.onDown() ?: false
                          if (tracking) {
                              animPress(true)
                              animPill(true)
                          }
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (tracking && !lockedHere) {
                              val p = ((downY - e.y) / dp(96f)).coerceIn(0f, 1f)
                              lockP = p
                              invalidate()
                              if (p >= 1f) {
                                  lockedHere = true
                                  listener?.onLock()
                              }
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                          if (tracking) {
                              tracking = false
                              animPress(false)
                              animPill(false)
                              animLockBack()
                              lockedHere = false
                              listener?.onUp()
                          }
                          return true
                      }
                  }
                  return true
              }

              override fun onDraw(canvas: Canvas) {
                  val cx = cxf
                  val cy = cyf
                  val r = radius * (1f + 0.06f * press)

                  // pulse ring (kotha bolar shomoy)
                  if (mode == Mode.TALKING || mode == Mode.LOCKED) {
                      for (i in 0..1) {
                          val p = (pulse + i * 0.5f) % 1f
                          linePaint.color = COL_TALK
                          linePaint.alpha = ((1f - p) * 110).toInt()
                          linePaint.strokeWidth = dp(2f)
                          canvas.drawCircle(cx, cy, r + p * dp(46f), linePaint)
                      }
                  }
                  // connected glow
                  if (mode == Mode.READY) {
                      linePaint.color = COL_READY
                      linePaint.alpha = 70
                      linePaint.strokeWidth = dp(2f)
                      canvas.drawCircle(cx, cy, r + dp(9f), linePaint)
                  }

                  // main circle
                  fillPaint.color = fillColor
                  canvas.drawCircle(cx, cy, r, fillPaint)
                  linePaint.color = Color.WHITE
                  linePaint.alpha = 22
                  linePaint.strokeWidth = dp(1.5f)
                  canvas.drawCircle(cx, cy, r - dp(1f), linePaint)

                  // connecting spinner
                  if (mode == Mode.CONNECTING) {
                      linePaint.color = COL_ACCENT
                      linePaint.alpha = 255
                      linePaint.strokeWidth = dp(3f)
                      rect.set(cx - r - dp(10f), cy - r - dp(10f), cx + r + dp(10f), cy + r + dp(10f))
                      canvas.drawArc(rect, spinner, 80f, false, linePaint)
                  }

                  // icon
                  if (mode == Mode.LOCKED) drawStop(canvas, cx, cy, r) else drawMic(canvas, cx, cy, r)

                  // lock pill
                  if (pill > 0.01f) drawPill(canvas, cx, cy, r)
              }

              private fun drawMic(c: Canvas, cx: Float, cy: Float, r: Float) {
                  val s = r * 0.52f
                  fillPaint.color = iconColor
                  rect.set(cx - s * 0.28f, cy - s * 0.74f, cx + s * 0.28f, cy + s * 0.16f)
                  c.drawRoundRect(rect, s * 0.28f, s * 0.28f, fillPaint)
                  linePaint.color = iconColor
                  linePaint.alpha = 255
                  linePaint.strokeWidth = s * 0.11f
                  rect.set(cx - s * 0.5f, cy - s * 0.44f, cx + s * 0.5f, cy + s * 0.46f)
                  c.drawArc(rect, 0f, 180f, false, linePaint)
                  c.drawLine(cx, cy + s * 0.46f, cx, cy + s * 0.74f, linePaint)
                  c.drawLine(cx - s * 0.22f, cy + s * 0.74f, cx + s * 0.22f, cy + s * 0.74f, linePaint)
              }

              private fun drawStop(c: Canvas, cx: Float, cy: Float, r: Float) {
                  val s = r * 0.17f
                  fillPaint.color = Color.WHITE
                  rect.set(cx - s, cy - s, cx + s, cy + s)
                  c.drawRoundRect(rect, s * 0.3f, s * 0.3f, fillPaint)
              }

              private fun drawPill(c: Canvas, cx: Float, cy: Float, r: Float) {
                  val w = dp(52f)
                  val h = dp(132f)
                  val bottom = cy - radius - dp(30f)
                  val top = bottom - h
                  val a = pill
                  rect.set(cx - w / 2, top, cx + w / 2, bottom)
                  fillPaint.color = Color.WHITE
                  fillPaint.alpha = (28 * a).toInt()
                  c.drawRoundRect(rect, w / 2, w / 2, fillPaint)

                  // lock icon (upore)
                  val lx = cx
                  val ly = top + dp(34f)
                  val sz = dp(18f)
                  val lift = dp(4f) * (1f - lockP)
                  val mix = (0.45f + 0.55f * lockP)
                  fillPaint.color = if (lockP >= 1f) COL_ACCENT else Color.WHITE
                  fillPaint.alpha = (255 * a * mix).toInt()
                  rect.set(lx - sz / 2, ly, lx + sz / 2, ly + sz * 0.8f)
                  c.drawRoundRect(rect, dp(3f), dp(3f), fillPaint)
                  linePaint.color = fillPaint.color
                  linePaint.alpha = fillPaint.alpha
                  linePaint.strokeWidth = dp(2.2f)
                  rect.set(lx - sz * 0.32f, ly - sz * 0.5f - lift, lx + sz * 0.32f, ly + dp(2f) - lift)
                  c.drawArc(rect, 180f, 180f, false, linePaint)

                  // thumb (angul er shathe uthbe)
                  val thumbBottom = bottom - dp(22f)
                  val thumbTop = top + dp(70f)
                  val ty = thumbBottom + (thumbTop - thumbBottom) * lockP
                  fillPaint.color = COL_ACCENT
                  fillPaint.alpha = (255 * a).toInt()
                  c.drawCircle(cx, ty, dp(9f), fillPaint)
                  fillPaint.alpha = 255
              }
          }
          WT_EOF
          mkdir -p app/src/main/java/com/walkietalk/app
          cat > app/src/main/java/com/walkietalk/app/WalkieService.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.QueryDocumentSnapshot

          class WalkieService : Service() {
              private var reg: ListenerRegistration? = null
              private val calls = HashMap<String, Call>()
              private var wl: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, buildNotification())
                  Dbg.log("service chalu")
                  if (wl == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "walkietalk:listener").apply { acquire() }
                  }
                  listen()
                  return START_STICKY
              }

              private fun buildNotification(): Notification {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel("walkie", "WalkieTalk", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "walkie")
                  else Notification.Builder(this)
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return b.setContentIntent(open)
                      .setContentTitle("WalkieTalk chalu ache")
                      .setContentText("Bondhur kotha shunar jonno ready")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()
              }

              private fun listen() {
                  if (reg != null) return
                  val uid = FirebaseAuth.getInstance().currentUser?.uid
                  if (uid == null) { Dbg.log("service: login nei, bondho"); stopSelf(); return }
                  Dbg.log("service shunche (uid ${uid.take(6)})")
                  reg = FirebaseFirestore.getInstance().collection("calls")
                      .whereEqualTo("to", uid)
                      .addSnapshotListener { qs, e ->
                          if (e != null) Dbg.log("service listen error: ${e.message}")
                          if (qs == null) return@addSnapshotListener
                          for (ch in qs.documentChanges) {
                              val d = ch.document
                              when (ch.type) {
                                  DocumentChange.Type.ADDED ->
                                      if (d.getString("state") == "offer") handle(d)
                                  DocumentChange.Type.MODIFIED ->
                                      if (d.getString("state") == "ended") calls[d.id]?.close()
                                  DocumentChange.Type.REMOVED ->
                                      calls[d.id]?.close()
                              }
                          }
                      }
              }

              private fun handle(d: QueryDocumentSnapshot) {
                  if (calls.containsKey(d.id)) return
                  val from = d.getString("from") ?: return
                  val code = d.getString("fromCode") ?: return
                  val offer = d.getString("offer") ?: return
                  val ts = d.getLong("ts") ?: 0L
                  if (ts > 0 && Math.abs(System.currentTimeMillis() - ts) > 5 * 60 * 1000) {
                      Dbg.log("purono offer, ignore")
                      return
                  }
                  Dbg.log("offer aslo, ID $code")
                  // shudhu approved (save kora) contact er kotha auto-play hobe
                  if (code !in Store.contacts(this)) { Dbg.log("$code contact e nei, ignore"); return }
                  FirebaseFirestore.getInstance().collection("ids").document(code).get()
                      .addOnSuccessListener { s ->
                          if (s.getString("uid") != from || calls.containsKey(d.id)) {
                              Dbg.log("ID check mile ni")
                              return@addOnSuccessListener
                          }
                          Dbg.log("call receive shuru")
                          val c = Call(applicationContext, d.reference, "callee")
                          calls[d.id] = c
                          audioOn()
                          c.onClosed = {
                              calls.remove(d.id)
                              if (calls.isEmpty()) audioOff()
                              Dbg.log("call shesh")
                          }
                          c.startAsCallee(offer)
                      }
              }

              private fun audioOn() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.mode = AudioManager.MODE_IN_COMMUNICATION
                      am.isSpeakerphoneOn = true
                      am.setStreamVolume(
                          AudioManager.STREAM_VOICE_CALL,
                          am.getStreamMaxVolume(AudioManager.STREAM_VOICE_CALL), 0
                      )
                  } catch (_: Exception) {}
              }

              private fun audioOff() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.isSpeakerphoneOn = false
                      am.mode = AudioManager.MODE_NORMAL
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  reg?.remove()
                  reg = null
                  calls.values.toList().forEach { it.close() }
                  wl?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }
          }
          WT_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'WT_EOF'
