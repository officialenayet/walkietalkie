              private val tick = object : Runnable {
                  override fun run() {
                      val c = call
                      if (c == null || c.connected) return
                      val e = (System.currentTimeMillis() - sessionStart) / 1000
                      if (e >= 45) {
                          closeCall()
                          failed = true
                          render()
                          return
                      }
                      render()
                      handler.postDelayed(this, 1000)
                  }
              }

