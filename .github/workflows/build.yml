name: Build WalkieTalk APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check google-services.json
        run: |
          test -f google-services.json || (echo "google-services.json repo er root e upload koro" && exit 1)

      - name: Project files banao
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'WT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.walkietalk.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.walkietalk.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              signingConfigs {
                  getByName("debug") {
                      enableV1Signing = true
                      enableV2Signing = true
