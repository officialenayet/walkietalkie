          cat > app/src/main/java/com/walkietalk/app/Store.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.content.Context
          import android.os.Handler
          import android.os.Looper

          object Store {
              private fun p(c: Context) = c.getSharedPreferences("wt", Context.MODE_PRIVATE)

              fun myCode(c: Context): String? = p(c).getString("code", null)
              fun myUid(c: Context): String? = p(c).getString("uid", null)

              fun setMy(c: Context, code: String, uid: String) {
                  p(c).edit().putString("code", code).putString("uid", uid).apply()
              }

              fun contacts(c: Context): List<String> =
                  (p(c).getStringSet("contacts", emptySet()) ?: emptySet()).toList().sorted()

              fun addContact(c: Context, code: String) {
                  val s = HashSet(contacts(c))
                  s.add(code)
                  p(c).edit().putStringSet("contacts", s).apply()
              }

              fun removeContact(c: Context, code: String) {
                  val s = HashSet(contacts(c))
                  s.remove(code)
                  p(c).edit().putStringSet("contacts", s).apply()
              }

              fun batteryAsked(c: Context): Boolean = p(c).getBoolean("battery_asked", false)
              fun setBatteryAsked(c: Context) { p(c).edit().putBoolean("battery_asked", true).apply() }
          }

          object Dbg {
              private val lines = ArrayDeque<String>()
              @Volatile var sink: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())

              fun log(s: String) {
                  val t = java.text.SimpleDateFormat("HH:mm:ss", java.util.Locale.US).format(java.util.Date())
                  main.post {
                      lines.addLast("$t $s")
                      while (lines.size > 60) lines.removeFirst()
                      sink?.invoke()
                  }
              }

              fun all(): String = lines.joinToString("\n")
          }
