          package com.walkietalk.app

          import com.google.firebase.auth.FirebaseAuth
          import java.net.HttpURLConnection
          import java.net.URL

          object Push {
              /** Opor phone ke Google push diye jagano (Cloudflare Worker hoye) */
              fun wake(targetToken: String) {
                  if (Cfg.PUSH_URL.isBlank() || Cfg.PUSH_URL.startsWith("__")) {
                      Dbg.log("push URL set kora nei")
                      return
                  }
                  val user = FirebaseAuth.getInstance().currentUser ?: return
                  user.getIdToken(false).addOnSuccessListener { r ->
                      Thread {
                          try {
                              val c = URL(Cfg.PUSH_URL).openConnection() as HttpURLConnection
                              c.requestMethod = "POST"
                              c.setRequestProperty("Authorization", "Bearer ${r.token}")
                              c.setRequestProperty("Content-Type", "application/json")
                              c.doOutput = true
                              c.connectTimeout = 8000
                              c.readTimeout = 8000
                              c.outputStream.use { it.write("""{"token":"$targetToken"}""".toByteArray()) }
                              val code = c.responseCode
                              val body = try {
                                  (if (code < 400) c.inputStream else c.errorStream).bufferedReader().readText().take(120)
                              } catch (_: Exception) { "" }
                              Dbg.log("push: $code $body")
                              c.disconnect()
                          } catch (e: Exception) {
                              Dbg.log("push fail: ${e.message}")
                          }
                      }.start()
                  }.addOnFailureListener { Dbg.log("idToken fail: ${it.message}") }
              }
          }
