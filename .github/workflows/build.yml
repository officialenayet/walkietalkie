              private fun openUrl(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                  } catch (_: Exception) {
                      toast("Could not open the link")
                  }
              }

              /** number ba string (jemon "130") dutoi cholbe */
              private fun numOf(v: Any?): Int = when (v) {
                  is Number -> v.toInt()
                  is String -> v.trim().toIntOrNull() ?: 0
                  else -> 0
              }

              /** Firestore config/app theke dekhe: minVersion er cheye purono hole app lock */
              private fun checkUpdate() {
                  val now = System.currentTimeMillis()
                  if (now - lastUpdateCheck < 60_000) return
                  lastUpdateCheck = now
                  db.collection("config").document("app").get().addOnSuccessListener { s ->
                      val min = numOf(s.get("minVersion"))
                      val latest = numOf(s.get("latest"))
                      val url = s.getString("apkUrl") ?: ""
                      val note = s.getString("message") ?: ""
                      val cur = appVersion
                      if (cur < min) {
                          forceUpdate = true
                          closeCall()
                          updateMsg.text = (if (note.isNotBlank()) note + "\n\n" else "") +
                              "Your version: $cur · Required: $min"
                          updateBtn.visibility = if (url.isBlank()) View.GONE else View.VISIBLE
                          updateBtn.setOnClickListener { openUrl(url) }
                          updatePanel.alpha = 0f
                          updatePanel.visibility = View.VISIBLE
                          updatePanel.animate().alpha(1f).setDuration(220).start()
                      } else {
                          if (forceUpdate) {
                              forceUpdate = false
                              updatePanel.visibility = View.GONE
                          }
                          if (latest > cur && url.isNotBlank() && !softShown) {
                              softShown = true
                              dlg()
                                  .setTitle("New version available")
                                  .setMessage(if (note.isNotBlank()) note else "A newer version of Enaye-Ten is ready.")
                                  .setPositiveButton("Update") { _, _ -> openUrl(url) }
                                  .setNegativeButton("Later", null)
                                  .show()
                          }
                      }
                  }
              }

              private fun toggleLog() {
                  if (logPanel.visibility == View.VISIBLE) {
                      logPanel.animate().alpha(0f).setDuration(160).withEndAction {
                          logPanel.visibility = View.GONE
                      }.start()
                  } else {
                      logView.text = Dbg.all()
                      logPanel.alpha = 0f
                      logPanel.visibility = View.VISIBLE
                      logPanel.animate().alpha(1f).setDuration(180).start()
                      logScroll.post { logScroll.fullScroll(View.FOCUS_DOWN) }
                  }
              }

              private fun haptic() {
                  talk.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
              }

              private fun setStatus(main: String, sub: String) {
                  if (sub != subView.text.toString()) subView.text = sub
                  if (main == shownStatus) return
                  shownStatus = main
                  statusView.animate().cancel()
                  statusView.animate().alpha(0f).translationY(dp(4).toFloat()).setDuration(110).withEndAction {
                      statusView.text = shownStatus
                      statusView.translationY = -dp(4).toFloat()
                      statusView.animate().alpha(1f).translationY(0f).setDuration(190).start()
                  }.start()
              }

              private fun waitMain(e: Long): String = when {
                  e < 5 -> "Connecting…"
                  e < 12 -> "Still connecting…"
                  e < 22 -> "Wait a while…"
                  e < 35 -> "Waking up your friend…"
                  else -> "Almost there, hang on…"
              }

              private fun waitSub(e: Long, who: String): String = when {
                  e < 12 -> "with $who"
                  e < 22 -> "This can take a few seconds"
                  e < 35 -> "Their phone may be asleep"
                  else -> "Both phones need internet"
              }

              /** Pura screen er obostha ekshathe */
              private fun render() {
                  val c = call
                  val live = c != null && c.connected
                  val sel = selected
                  val who = if (sel != null) (Store.nameOf(this, sel) ?: sel) else ""
                  content.keepScreenOn = holding

                  if (fatal != null) { talk.mode = TalkButton.Mode.IDLE; setStatus(fatal!!, ""); return }
                  if (!registered) { talk.mode = TalkButton.Mode.IDLE; setStatus("Setting up…", ""); return }
                  if (sel == null) {
                      talk.mode = TalkButton.Mode.IDLE
                      val none = Store.contacts(this).isEmpty()
                      setStatus(if (none) "Add a friend to begin" else "Select a friend", if (none) "Tap + above" else "")
                      return
                  }

                  val mode = when {
                      locked && live -> TalkButton.Mode.LOCKED
                      locked -> TalkButton.Mode.CONNECTING
                      holding && live -> TalkButton.Mode.TALKING
                      holding -> TalkButton.Mode.CONNECTING
                      live -> TalkButton.Mode.READY
                      c != null -> TalkButton.Mode.CONNECTING
                      else -> TalkButton.Mode.IDLE
                  }
                  talk.mode = mode

                  val e = if (c != null && !live) (System.currentTimeMillis() - sessionStart) / 1000 else 0L
                  when {
                      locked && live -> setStatus("Locked · tap to stop", "with $who")
                      holding && live -> setStatus("Talking", "with $who")
                      live -> setStatus("Connected", "Hold to talk · slide up to lock")
                      c != null -> setStatus(waitMain(e), waitSub(e, who))
                      failed -> setStatus("Couldn't connect", "Tap to try again")
                      else -> setStatus("Tap to connect", "with $who")
                  }
              }

              // ------------------------------------------------------------ friends
              private fun refreshChips() {
                  chipRow.removeAllViews()
                  for (code in Store.contacts(this)) {
                      val sel = code == selected
                      val nm = Store.nameOf(this, code)
                      val label = if (nm != null) "$nm\n$code" else code
                      val sp = SpannableString(label)
                      if (nm != null) {
                          val i = nm.length + 1
                          sp.setSpan(RelativeSizeSpan(0.72f), i, label.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                          sp.setSpan(
                              ForegroundColorSpan(if (sel) 0xCCFFFFFF.toInt() else 0xFF7C8196.toInt()),
                              i, label.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE
                          )
                      }
                      val chip = TextView(this).apply {
                          text = sp
                          textSize = 15f
                          gravity = Gravity.CENTER
                          typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                          setTextColor(if (sel) Color.WHITE else CHIP_TXT)
                          setPadding(dp(18), dp(8), dp(18), dp(8))
                          background = round(if (sel) TalkButton.COL_READY else CHIP_BG, 22, !sel)
                          alpha = 0f
                          setOnClickListener { select(code) }
                          setOnLongClickListener {
                              dlg()
                                  .setTitle(nm ?: code)
                                  .setItems(arrayOf("Rename", "Remove")) { _, which ->
                                      if (which == 0) showRenameDialog(code) else confirmRemove(code)
                                  }
                                  .show()
                              true
                          }
                      }
                      chipRow.addView(
                          chip,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { rightMargin = dp(8) }
                      )
                      chip.animate().alpha(1f).setDuration(220).start()
                  }
                  val add = TextView(this).apply {
                      text = "+"
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setTextColor(TalkButton.COL_ACCENT)
                      setPadding(dp(18), dp(7), dp(18), dp(7))
                      background = round(CHIP_BG, 22, true)
                      setOnClickListener { showAddDialog() }
                  }
                  chipRow.addView(add)
              }

              private fun select(code: String) {
                  if (holding) return
                  failed = false
                  closeCall()
                  selected = if (code == selected) null else code
                  refreshChips()
                  val s = selected
                  if (s != null) resolve(s)
                  render()
              }

              private fun setAlwaysOn(on: Boolean) {
                  Store.setAlwaysOn(this, on)
                  if (on) {
                      Incoming.serviceUp = true
                      try {
                          startForegroundService(Intent(this, WalkieService::class.java))
                      } catch (_: Exception) {
                          Incoming.serviceUp = false
                      }
                  } else {
                      stopService(Intent(this, WalkieService::class.java))
                  }
              }

