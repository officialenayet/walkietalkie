          package com.walkietalk.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.ListenerRegistration
          import com.google.firebase.firestore.QueryDocumentSnapshot

          class WalkieService : Service() {
              private var reg: ListenerRegistration? = null
              private var current: Call? = null
              private var wl: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, buildNotification())
                  Dbg.log("service chalu")
                  if (wl == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "walkietalk:listener").apply { acquire() }
                  }
                  listen()
                  return START_STICKY
              }

              private fun buildNotification(): Notification {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel("walkie", "WalkieTalk", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val b = if (Build.VERSION.SDK_INT >= 26) Notification.Builder(this, "walkie")
                  else Notification.Builder(this)
                  return b.setContentTitle("WalkieTalk chalu ache")
                      .setContentText("Bondhur kotha shunar jonno ready")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()
              }

              private fun listen() {
                  if (reg != null) return
                  val uid = FirebaseAuth.getInstance().currentUser?.uid
                  if (uid == null) { Dbg.log("service: login nei, bondho"); stopSelf(); return }
                  Dbg.log("service shunche (uid ${uid.take(6)})")
                  reg = FirebaseFirestore.getInstance().collection("calls")
                      .whereEqualTo("to", uid)
                      .whereEqualTo("state", "offer")
                      .addSnapshotListener { qs, e ->
                          if (e != null) Dbg.log("service listen error: ${e.message}")
                          if (qs == null) return@addSnapshotListener
                          for (ch in qs.documentChanges) {
                              if (ch.type == DocumentChange.Type.ADDED) handle(ch.document)
                          }
                      }
              }

              private fun handle(d: QueryDocumentSnapshot) {
                  if (current != null) return
                  val from = d.getString("from") ?: return
                  val code = d.getString("fromCode") ?: return
                  val offer = d.getString("offer") ?: return
                  // shudhu approved (save kora) contact er kotha auto-play hobe
                  Dbg.log("offer aslo, ID $code")
                  if (code !in Store.contacts(this)) { Dbg.log("$code contact e nei, ignore"); return }
                  FirebaseFirestore.getInstance().collection("ids").document(code).get()
                      .addOnSuccessListener { s ->
                          if (s.getString("uid") != from || current != null) {
                              Dbg.log("ID check mile ni ba busy")
                              return@addOnSuccessListener
                          }
                          Dbg.log("call receive shuru")
                          val c = Call(applicationContext, d.reference, "callee")
                          current = c
                          audioOn()
                          c.onClosed = { current = null; audioOff() }
                          c.startAsCallee(offer)
                      }
              }

              private fun audioOn() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.mode = AudioManager.MODE_IN_COMMUNICATION
                      am.isSpeakerphoneOn = true
                      am.setStreamVolume(
                          AudioManager.STREAM_VOICE_CALL,
                          am.getStreamMaxVolume(AudioManager.STREAM_VOICE_CALL), 0
                      )
                  } catch (_: Exception) {}
              }

              private fun audioOff() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.isSpeakerphoneOn = false
                      am.mode = AudioManager.MODE_NORMAL
                  } catch (_: Exception) {}
              }

              override fun onDestroy() {
                  reg?.remove()
                  reg = null
                  current?.close()
                  wl?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }
          }
          WT_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'WT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#3F51B5" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,28a10,10 0,0 1,10 10v16a10,10 0,0 1,-20 0v-16a10,10 0,0 1,10 -10z" />
              <path android:fillColor="#FFFFFF" android:pathData="M40,52h4v2a10,10 0,0 0,20 0v-2h4v2a14,14 0,0 1,-12 13.8v6.2h-4v-6.2a14,14 0,0 1,-12 -13.8z" />
          </vector>
          WT_EOF
          cat > build.gradle.kts <<'WT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          WT_EOF
          cat > gradle.properties <<'WT_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          WT_EOF
          cat > settings.gradle.kts <<'WT_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WalkieTalk"
          include(":app")
          WT_EOF
          cp google-services.json app/google-services.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK info
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          ls -l app/build/outputs/apk/debug/app-debug.apk
          $BT/aapt2 dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package|launchable|icon" | head
          $BT/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk | head -8

      - name: Release banao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: WalkieTalk v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
