                  if (Build.VERSION.SDK_INT >= 26) {
                      f = if (!dark) f or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      else f and View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR.inv()
                  }
                  window.decorView.systemUiVisibility = f
                  frame.background = GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(BG1, BG2))
                  titleView.setTextColor(INK)
                  themeBtn.setTextColor(CHIP_TXT)
                  themeBtn.background = round(CHIP_BG, 16, true)
                  settingsBtn.setTextColor(CHIP_TXT)
                  settingsBtn.background = round(CHIP_BG, 16, true)
