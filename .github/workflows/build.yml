name: Build WalkieTalk APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check google-services.json
        run: |
          test -f google-services.json || (echo "google-services.json repo er root e upload koro" && exit 1)

      - name: Project files banao
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'WT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.google.gms.google-services")
          }

          android {
              namespace = "com.walkietalk.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.walkietalk.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              signingConfigs {
                  getByName("debug") {
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
          }

          dependencies {
              implementation(platform("com.google.firebase:firebase-bom:33.1.2"))
              implementation("com.google.firebase:firebase-auth-ktx")
              implementation("com.google.firebase:firebase-firestore-ktx")
              implementation("io.getstream:stream-webrtc-android:1.1.1")
          }
          WT_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'WT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
