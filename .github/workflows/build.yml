          mkdir -p app/src/main/java/com/walkietalk/app
          cat > app/src/main/java/com/walkietalk/app/Call.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import com.google.firebase.firestore.DocumentChange
          import com.google.firebase.firestore.DocumentReference
          import com.google.firebase.firestore.ListenerRegistration
          import org.webrtc.AudioSource
          import org.webrtc.AudioTrack
          import org.webrtc.DataChannel
          import org.webrtc.IceCandidate
          import org.webrtc.IceCandidateErrorEvent
          import org.webrtc.MediaConstraints
          import org.webrtc.MediaStream
          import org.webrtc.PeerConnection
          import org.webrtc.PeerConnectionFactory
          import org.webrtc.RtpReceiver
          import org.webrtc.RtpTransceiver
          import org.webrtc.SdpObserver
          import org.webrtc.SessionDescription
          import org.webrtc.audio.JavaAudioDeviceModule

          object Cfg {
              const val TURN_USER = "e67e578a63af4443419fec23"
              const val TURN_PASS = "17MRacfYDu+CzIyf"
              const val PUSH_URL = "__PUSH_URL__"
          }

          object Rtc {
              private var factory: PeerConnectionFactory? = null

              @Synchronized
              fun factory(ctx: Context): PeerConnectionFactory {
                  factory?.let { return it }
                  val app = ctx.applicationContext
                  PeerConnectionFactory.initialize(
                      PeerConnectionFactory.InitializationOptions.builder(app).createInitializationOptions()
                  )
                  val adm = JavaAudioDeviceModule.builder(app).createAudioDeviceModule()
                  val f = PeerConnectionFactory.builder().setAudioDeviceModule(adm).createPeerConnectionFactory()
                  factory = f
                  return f
              }

              fun iceServers(): List<PeerConnection.IceServer> = listOf(
                  PeerConnection.IceServer.builder("stun:stun.relay.metered.ca:80").createIceServer(),
                  PeerConnection.IceServer.builder(
                      listOf(
                          "turn:global.relay.metered.ca:80",
                          "turn:global.relay.metered.ca:80?transport=tcp",
                          "turn:global.relay.metered.ca:443",
                          "turns:global.relay.metered.ca:443?transport=tcp"
                      )
                  ).setUsername(Cfg.TURN_USER).setPassword(Cfg.TURN_PASS).createIceServer(),
                  PeerConnection.IceServer.builder(
                      listOf(
                          "turn:openrelay.metered.ca:80",
                          "turn:openrelay.metered.ca:443",
                          "turns:openrelay.metered.ca:443?transport=tcp"
                      )
                  ).setUsername("openrelayproject").setPassword("openrelayproject").createIceServer()
              )
          }

          open class SdpAdapter : SdpObserver {
              override fun onCreateSuccess(d: SessionDescription?) {}
              override fun onSetSuccess() {}
              override fun onCreateFailure(e: String?) { Dbg.log("SDP create fail: $e") }
              override fun onSetFailure(e: String?) { Dbg.log("SDP set fail: $e") }
          }

          /** side = "caller" (je bole) ba "callee" (je shune) */
          class Call(ctx: Context, private val ref: DocumentReference, private val side: String) {
              private val factory = Rtc.factory(ctx)
              private var pc: PeerConnection? = null
              private var source: AudioSource? = null
              private var track: AudioTrack? = null
              private val regs = mutableListOf<ListenerRegistration>()
              private val pending = mutableListOf<IceCandidate>()
              private val otherSide = if (side == "caller") "callee" else "caller"

              private val main = Handler(Looper.getMainLooper())

              @Volatile var connected = false
              @Volatile var closed = false
              @Volatile private var remoteSet = false
              @Volatile private var gotAnswer = false
              var onClosed: (() -> Unit)? = null
              var onConnected: (() -> Unit)? = null

              private val observer = object : PeerConnection.Observer {
                  override fun onIceCandidate(c: IceCandidate?) {
                      if (c == null) return
                      val typ = Regex("typ (\\w+)").find(c.sdp)?.groupValues?.get(1)
                      Dbg.log("$side candidate: $typ")
                      ref.collection("candidates").add(
                          mapOf("side" to side, "mid" to c.sdpMid, "idx" to c.sdpMLineIndex, "sdp" to c.sdp)
                      )
                  }
                  override fun onSignalingChange(s: PeerConnection.SignalingState?) {}
                  override fun onIceConnectionChange(s: PeerConnection.IceConnectionState?) {
                      Dbg.log("$side ICE: $s")
                      if (s == PeerConnection.IceConnectionState.CONNECTED ||
                          s == PeerConnection.IceConnectionState.COMPLETED
                      ) {
                          if (!connected) {
                              connected = true
                              main.post { onConnected?.invoke() }
                          }
                      } else if (s == PeerConnection.IceConnectionState.FAILED) {
                          main.post { if (side == "caller") hangup() else close() }
                      }
                  }
                  override fun onConnectionChange(s: PeerConnection.PeerConnectionState?) { Dbg.log("$side conn: $s") }
                  override fun onTrack(t: RtpTransceiver?) { Dbg.log("$side: remote track aaslo") }
                  override fun onIceConnectionReceivingChange(b: Boolean) {}
                  override fun onIceCandidateError(e: IceCandidateErrorEvent?) {
                      if (e != null) Dbg.log("$side ICE error ${e.errorCode} ${e.url} ${e.errorText.take(50)}")
                  }
                  override fun onIceGatheringChange(s: PeerConnection.IceGatheringState?) { Dbg.log("$side gathering: $s") }
                  override fun onIceCandidatesRemoved(a: Array<out IceCandidate>?) {}
                  override fun onAddStream(s: MediaStream?) {}
                  override fun onRemoveStream(s: MediaStream?) {}
                  override fun onDataChannel(d: DataChannel?) {}
                  override fun onRenegotiationNeeded() {}
                  override fun onAddTrack(r: RtpReceiver?, s: Array<out MediaStream>?) {}
              }

              private fun newPc(): PeerConnection? {
                  val cfg = PeerConnection.RTCConfiguration(Rtc.iceServers())
                  cfg.sdpSemantics = PeerConnection.SdpSemantics.UNIFIED_PLAN
                  pc = factory.createPeerConnection(cfg, observer)
                  return pc
              }

              private fun drain() {
                  val list: List<IceCandidate>
                  synchronized(pending) {
                      list = pending.toList()
                      pending.clear()
                  }
                  list.forEach { pc?.addIceCandidate(it) }
              }

              private fun listenCandidates() {
                  regs += ref.collection("candidates").whereEqualTo("side", otherSide)
                      .addSnapshotListener { qs, e ->
                          if (e != null) Dbg.log("candidates listen error: ${e.message}")
                          if (qs == null) return@addSnapshotListener
                          for (ch in qs.documentChanges) {
                              if (ch.type != DocumentChange.Type.ADDED) continue
                              val d = ch.document
                              val c = IceCandidate(
                                  d.getString("mid"),
                                  (d.getLong("idx") ?: 0L).toInt(),
                                  d.getString("sdp") ?: continue
                              )
                              Dbg.log("$side: opor er candidate peyechi (${Regex("typ (\\w+)").find(c.sdp)?.groupValues?.get(1)})")
                              if (remoteSet) pc?.addIceCandidate(c)
                              else synchronized(pending) { pending.add(c) }
                          }
                      }
              }

              // ---- Je bole (caller) ----
              fun startAsCaller(toUid: String, fromCode: String, myUid: String) {
                  val p = newPc() ?: return
                  source = factory.createAudioSource(MediaConstraints())
                  track = factory.createAudioTrack("a0", source)
                  track?.setEnabled(false)
                  p.addTransceiver(
                      track,
                      RtpTransceiver.RtpTransceiverInit(RtpTransceiver.RtpTransceiverDirection.SEND_ONLY)
                  )
                  listenCandidates()
                  p.createOffer(object : SdpAdapter() {
                      override fun onCreateSuccess(d: SessionDescription?) {
                          if (d == null || closed) return
                          p.setLocalDescription(SdpAdapter(), d)
                          ref.set(
                              mapOf(
                                  "from" to myUid, "to" to toUid, "fromCode" to fromCode,
                                  "state" to "offer", "offer" to d.description,
                                  "ts" to System.currentTimeMillis()
                              )
                          ).addOnFailureListener {
                              Dbg.log("offer write FAIL: ${it.message}")
                          }.addOnSuccessListener {
                              Dbg.log("offer likha holo, answer er opekkha")
                              if (closed) {
                                  ref.delete()
                              } else {
                                  regs += ref.addSnapshotListener { s, e ->
                                      if (e != null) Dbg.log("call listen error: ${e.message}")
                                      if (e != null || s == null || closed) return@addSnapshotListener
                                      if (!s.exists()) { close(); return@addSnapshotListener }
                                      val ans = s.getString("answer")
                                      if (ans != null && !gotAnswer) {
                                          gotAnswer = true
                                          Dbg.log("answer peyechi")
                                          pc?.setRemoteDescription(object : SdpAdapter() {
                                              override fun onSetSuccess() { remoteSet = true; drain() }
                                          }, SessionDescription(SessionDescription.Type.ANSWER, ans))
                                      }
                                      if (s.getString("state") == "ended") close()
                                  }
                              }
                          }
                      }
                  }, MediaConstraints())
              }

              // ---- Je shune (callee) ----
              fun startAsCallee(offer: String) {
                  val p = newPc() ?: return
                  listenCandidates()
                  p.setRemoteDescription(object : SdpAdapter() {
                      override fun onSetSuccess() {
                          remoteSet = true
                          drain()
                          p.createAnswer(object : SdpAdapter() {
                              override fun onCreateSuccess(d: SessionDescription?) {
                                  if (d == null || closed) return
                                  p.setLocalDescription(SdpAdapter(), d)
                                  ref.update(mapOf("answer" to d.description, "state" to "answered"))
                                      .addOnSuccessListener { Dbg.log("answer pathano holo") }
                                      .addOnFailureListener { Dbg.log("answer write FAIL: ${it.message}") }
                              }
                          }, MediaConstraints())
                      }
                  }, SessionDescription(SessionDescription.Type.OFFER, offer))
              }

              @Synchronized
              fun close() {
                  if (closed) return
                  closed = true
                  regs.forEach { it.remove() }
                  regs.clear()
                  try { pc?.close() } catch (_: Exception) {}
                  try { pc?.dispose() } catch (_: Exception) {}
                  pc = null
                  try { track?.dispose() } catch (_: Exception) {}
                  try { source?.dispose() } catch (_: Exception) {}
                  onClosed?.invoke()
              }

              /** Button dhore rakhle true, charle false (session cholte thake) */
              fun setTalking(on: Boolean) {
                  track?.setEnabled(on)
              }

              /** Session shesh */
              fun hangup() {
                  val wasCaller = side == "caller"
                  close()
                  if (wasCaller) ref.delete()
              }
          }
          WT_EOF
          mkdir -p app/src/main/java/com/walkietalk/app
          cat > app/src/main/java/com/walkietalk/app/FcmService.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.content.Intent
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage

          class FcmService : FirebaseMessagingService() {
              override fun onNewToken(token: String) {
                  val code = Store.myCode(this) ?: return
                  FirebaseFirestore.getInstance().collection("ids").document(code).update("token", token)
              }

              override fun onMessageReceived(message: RemoteMessage) {
                  Dbg.log("push aslo, service jagano hocche")
                  try {
                      startForegroundService(Intent(this, WalkieService::class.java))
                  } catch (e: Exception) {
                      Dbg.log("service start fail: ${e.message}")
                  }
              }
          }
          WT_EOF
          mkdir -p app/src/main/java/com/walkietalk/app
          cat > app/src/main/java/com/walkietalk/app/MainActivity.kt <<'WT_EOF'
          package com.walkietalk.app

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.text.InputFilter
          import android.text.InputType
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.View
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.firestore.FirebaseFirestoreException
          import com.google.firebase.firestore.Transaction
          import com.google.firebase.messaging.FirebaseMessaging
          import kotlin.random.Random

          class MainActivity : Activity() {
              private val db by lazy { FirebaseFirestore.getInstance() }

              private val BG1 = 0xFF0B0D12.toInt()
              private val BG2 = 0xFF151926.toInt()
              private val CHIP_BG = 0xFF1A1D26.toInt()
              private val CHIP_TXT = 0xFFB4B8C8.toInt()

              private lateinit var content: LinearLayout
              private lateinit var idChip: TextView
              private lateinit var chipRow: LinearLayout
              private lateinit var statusView: TextView
              private lateinit var subView: TextView
              private lateinit var talk: TalkButton
              private lateinit var logPanel: LinearLayout
              private lateinit var logView: TextView
              private lateinit var logScroll: ScrollView

              private var selected: String? = null
              private val uidCache = HashMap<String, String>()
              private var call: Call? = null
              private var callCode: String? = null
              private var holding = false
              private var locked = false
              private var registered = false
              private var fatal: String? = null
              private var shownStatus = ""
              private val handler = Handler(Looper.getMainLooper())
              private val idleClose = Runnable { closeCall() }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = BG1
                  window.navigationBarColor = BG2
                  buildUi()
                  askPermissions()
                  register()
              }

              // ------------------------------------------------------------ UI
              private fun round(color: Int, radiusDp: Int): GradientDrawable =
                  GradientDrawable().apply {
                      cornerRadius = dp(radiusDp).toFloat()
                      setColor(color)
                  }

              private fun buildUi() {
                  val frame = FrameLayout(this)
                  frame.background = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM, intArrayOf(BG1, BG2)
                  )

                  content = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(26), dp(22), dp(6))
                  }

                  // header
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val title = TextView(this).apply {
                      text = "WalkieTalk"
                      textSize = 20f
                      letterSpacing = 0.06f
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                      setOnLongClickListener { toggleLog(); true }
                  }
                  idChip = TextView(this).apply {
                      text = "ID  ······"
                      textSize = 13f
                      setTextColor(CHIP_TXT)
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setPadding(dp(14), dp(7), dp(14), dp(7))
                      background = round(CHIP_BG, 16)
                      setOnClickListener {
                          val code = Store.myCode(this@MainActivity)
                          if (code != null) {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("id", code))
                              toast("ID copied")
                          }
                      }
                  }
                  header.addView(title, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  header.addView(idChip)

                  // friends
                  chipRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val chipScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(chipRow)
                  }

                  // status
                  statusView = TextView(this).apply {
                      text = "Setting up…"
                      textSize = 26f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
                  }
                  subView = TextView(this).apply {
                      text = ""
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(0xFF7C8196.toInt())
                      setPadding(0, dp(6), 0, 0)
                  }
                  val statusBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      addView(statusView)
                      addView(subView)
                  }

                  talk = TalkButton(this)
                  talk.listener = object : TalkButton.Listener {
                      override fun onDown(): Boolean {
                          if (locked) {
                              haptic()
                              stopTalk()
                              return false
                          }
                          if (selected == null) { toast("Add a friend first"); return false }
                          haptic()
                          return startTalk()
                      }

                      override fun onLock() {
                          locked = true
                          haptic()
                          render()
                      }

                      override fun onUp() {
                          if (!locked) stopTalk()
                      }
                  }

                  content.addView(header)
                  content.addView(
                      chipScroll,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(22) }
                  )
                  content.addView(statusBox, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  content.addView(talk, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(380)))

                  // hidden debug panel (title e long press)
                  logPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xF2080A0F.toInt())
                      setPadding(dp(16), dp(36), dp(16), dp(16))
                      visibility = View.GONE
                  }
                  val logBar = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val logTitle = TextView(this).apply {
                      text = "Debug log"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                  }
                  val copy = TextView(this).apply {
                      text = "Copy"
                      textSize = 14f
                      setTextColor(TalkButton.COL_ACCENT)
                      setPadding(dp(14), dp(8), dp(14), dp(8))
                      setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("log", Dbg.all()))
                          toast("Log copied")
                      }
                  }
                  val close = TextView(this).apply {
                      text = "Close"
                      textSize = 14f
                      setTextColor(CHIP_TXT)
                      setPadding(dp(14), dp(8), dp(14), dp(8))
                      setOnClickListener { toggleLog() }
                  }
                  logBar.addView(logTitle, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  logBar.addView(copy)
                  logBar.addView(close)
                  logView = TextView(this).apply {
                      textSize = 10f
                      setTextIsSelectable(true)
                      setTextColor(0xFFB9BECF.toInt())
                      text = Dbg.all()
                  }
                  logScroll = ScrollView(this).apply { addView(logView) }
                  logPanel.addView(logBar)
                  logPanel.addView(logScroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  Dbg.sink = {
                      logView.text = Dbg.all()
                      if (logPanel.visibility == View.VISIBLE) {
                          logScroll.post { logScroll.fullScroll(View.FOCUS_DOWN) }
                      }
                  }

                  frame.addView(content)
                  frame.addView(logPanel)
                  setContentView(frame)

                  // ashar shomoy halka animation
                  content.alpha = 0f
                  content.translationY = dp(14).toFloat()
                  content.animate().alpha(1f).translationY(0f).setDuration(480).start()

                  refreshChips()
                  render()
              }

              private fun toggleLog() {
                  if (logPanel.visibility == View.VISIBLE) {
                      logPanel.animate().alpha(0f).setDuration(160).withEndAction {
                          logPanel.visibility = View.GONE
                      }.start()
                  } else {
                      logView.text = Dbg.all()
                      logPanel.alpha = 0f
                      logPanel.visibility = View.VISIBLE
                      logPanel.animate().alpha(1f).setDuration(180).start()
                      logScroll.post { logScroll.fullScroll(View.FOCUS_DOWN) }
                  }
              }

              private fun haptic() {
                  talk.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
              }

              private fun setStatus(main: String, sub: String) {
                  if (sub != subView.text.toString()) subView.text = sub
                  if (main == shownStatus) return
                  shownStatus = main
                  statusView.animate().cancel()
                  statusView.animate().alpha(0f).translationY(dp(4).toFloat()).setDuration(110).withEndAction {
                      statusView.text = shownStatus
                      statusView.translationY = -dp(4).toFloat()
                      statusView.animate().alpha(1f).translationY(0f).setDuration(190).start()
                  }.start()
              }

              /** Pura screen er obostha ekshathe */
              private fun render() {
                  val c = call
                  val live = c != null && c.connected
                  val sel = selected
                  val sub = if (sel != null) "with $sel" else ""

                  if (fatal != null) { talk.mode = TalkButton.Mode.IDLE; setStatus(fatal!!, ""); return }
                  if (!registered) { talk.mode = TalkButton.Mode.IDLE; setStatus("Setting up…", ""); return }
                  if (sel == null) { talk.mode = TalkButton.Mode.IDLE; setStatus("Add a friend to begin", ""); return }

                  val mode = when {
                      locked && live -> TalkButton.Mode.LOCKED
                      locked -> TalkButton.Mode.CONNECTING
                      holding && live -> TalkButton.Mode.TALKING
                      holding -> TalkButton.Mode.CONNECTING
                      live -> TalkButton.Mode.READY
                      c != null -> TalkButton.Mode.CONNECTING
                      else -> TalkButton.Mode.IDLE
                  }
                  talk.mode = mode
                  val text = when {
                      locked && live -> "Locked · tap to stop"
                      holding && live -> "Talking"
                      holding || c != null -> "Connecting…"
                      else -> "Hold to talk"
                  }
                  val finalText = if (live && !holding && !locked) "Connected" else text
                  val hint = if (live && !locked) "Hold to talk · slide up to lock" else sub
                  setStatus(finalText, hint)
                  content.keepScreenOn = holding
              }

              // ------------------------------------------------------------ friends
              private fun refreshChips() {
                  chipRow.removeAllViews()
                  for (code in Store.contacts(this)) {
                      val sel = code == selected
                      val chip = TextView(this).apply {
                          text = code
                          textSize = 15f
                          typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                          setTextColor(if (sel) Color.WHITE else CHIP_TXT)
                          setPadding(dp(18), dp(10), dp(18), dp(10))
                          background = round(if (sel) TalkButton.COL_READY else CHIP_BG, 22)
                          alpha = 0f
                          setOnClickListener { select(code) }
                          setOnLongClickListener {
                              AlertDialog.Builder(this@MainActivity)
                                  .setTitle("Remove $code?")
                                  .setPositiveButton("Remove") { _, _ ->
                                      Store.removeContact(this@MainActivity, code)
                                      if (selected == code) { closeCall(); selected = null }
                                      refreshChips()
                                      render()
                                  }
                                  .setNegativeButton("Cancel", null)
                                  .show()
                              true
                          }
                      }
                      chipRow.addView(
                          chip,
                          LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT
                          ).apply { rightMargin = dp(8) }
                      )
                      chip.animate().alpha(1f).setDuration(220).start()
                  }
                  val add = TextView(this).apply {
                      text = "+"
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setTextColor(TalkButton.COL_ACCENT)
                      setPadding(dp(18), dp(7), dp(18), dp(7))
                      background = round(CHIP_BG, 22)
                      setOnClickListener { showAddDialog() }
                  }
                  chipRow.addView(add)
              }

              private fun select(code: String) {
                  if (code == selected) return
                  if (holding) return
                  closeCall()
                  selected = code
                  refreshChips()
                  render()
                  resolve(code) { prewarm() }
                  prewarm()
              }

              private fun showAddDialog() {
                  val et = EditText(this).apply {
                      hint = "6-digit friend ID"
                      inputType = InputType.TYPE_CLASS_NUMBER
                      filters = arrayOf(InputFilter.LengthFilter(6))
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setPadding(dp(24), dp(18), dp(24), dp(18))
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Add friend")
                      .setView(et)
                      .setPositiveButton("Add") { _, _ -> addContact(et.text.toString().trim()) }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun addContact(code: String) {
                  if (code.length != 6) { toast("Enter a 6-digit ID"); return }
                  if (code == Store.myCode(this)) { toast("That's your own ID"); return }
                  db.collection("ids").document(code).get().addOnSuccessListener { s ->
                      val u = s.getString("uid")
                      if (u == null) {
                          toast("ID not found")
                      } else {
                          uidCache[code] = u
                          Store.addContact(this, code)
                          if (selected == null) {
                              selected = code
                              prewarm()
                          }
                          refreshChips()
                          render()
                      }
                  }.addOnFailureListener { toast("Check your connection") }
              }

              private fun resolve(code: String, then: (() -> Unit)? = null) {
                  if (uidCache.containsKey(code)) { then?.invoke(); return }
                  db.collection("ids").document(code).get().addOnSuccessListener { s ->
                      val u = s.getString("uid")
                      if (u != null) { uidCache[code] = u; then?.invoke() }
                  }
              }

              // ------------------------------------------------------------ permissions / register
              private fun askPermissions() {
                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      need.add(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
                  if (registered) prewarm()
              }

              private fun register() {
                  val auth = FirebaseAuth.getInstance()
                  if (auth.currentUser == null) {
                      auth.signInAnonymously()
                          .addOnSuccessListener { claim() }
                          .addOnFailureListener { fatal = "Login failed"; Dbg.log("login: ${it.message}"); render() }
                  } else claim()
              }

              private fun claim() {
                  val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return
                  val existing = Store.myCode(this)
                  if (existing != null && Store.myUid(this) == uid) ready(existing) else tryClaim(uid, 0)
              }

              private fun tryClaim(uid: String, n: Int) {
                  if (n > 10) { fatal = "Could not get an ID"; render(); return }
                  val code = (100000 + Random.nextInt(900000)).toString()
                  val ref = db.collection("ids").document(code)
                  db.runTransaction(Transaction.Function<Any?> { t ->
                      if (t.get(ref).exists()) {
                          throw FirebaseFirestoreException("taken", FirebaseFirestoreException.Code.ABORTED)
                      }
                      t.set(ref, mapOf("uid" to uid))
                      null
                  }).addOnSuccessListener {
                      Store.setMy(this, code, uid)
                      ready(code)
                  }.addOnFailureListener {
                      if (it is FirebaseFirestoreException && it.code == FirebaseFirestoreException.Code.ABORTED) {
                          tryClaim(uid, n + 1)
                      } else {
                          fatal = "Setup failed"
                          Dbg.log("claim: ${it.message}")
                          render()
                      }
                  }
              }

              private fun ready(code: String) {
                  registered = true
                  idChip.text = "ID  $code"
                  if (selected == null) selected = Store.contacts(this).firstOrNull()
                  Store.contacts(this).forEach { c -> resolve(c) { if (c == selected) prewarm() } }
                  refreshChips()
                  render()
                  startForegroundService(Intent(this, WalkieService::class.java))
                  FirebaseMessaging.getInstance().token
                      .addOnSuccessListener { t ->
                          db.collection("ids").document(code).update("token", t)
                              .addOnFailureListener { Dbg.log("token save fail: ${it.message}") }
                      }
                      .addOnFailureListener { Dbg.log("push token fail: ${it.message}") }
                  askBattery()
              }

              private fun askBattery() {
                  if (Store.batteryAsked(this)) return
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                      Store.setBatteryAsked(this)
                      try {
                          startActivity(
                              Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                  .setData(Uri.parse("package:$packageName"))
                          )
                      } catch (_: Exception) {}
                  }
              }

              // ------------------------------------------------------------ session / talk
              private fun closeCall() {
                  handler.removeCallbacks(idleClose)
                  val c = call
                  call = null
                  callCode = null
                  holding = false
                  locked = false
                  c?.hangup()
                  render()
              }

              private fun ensureSession(quiet: Boolean): Call? {
                  val code = selected
                  if (code == null) return null
                  val to = uidCache[code]
                  if (to == null) {
                      resolve(code)
                      if (!quiet) toast("Checking ID, try again")
                      return null
                  }
                  val existing = call
                  if (existing != null && callCode == code && !existing.closed) return existing
                  val me = FirebaseAuth.getInstance().currentUser?.uid
                  val myCode = Store.myCode(this)
                  if (me == null || myCode == null) return null
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      if (!quiet) askPermissions()
                      return null
                  }
                  closeCall()
                  val c = Call(applicationContext, db.collection("calls").document(), "caller")
                  call = c
                  callCode = code
                  c.onClosed = {
                      runOnUiThread {
                          if (call === c) {
                              call = null
                              callCode = null
                              holding = false
                              locked = false
                          }
                          render()
                      }
                  }
                  c.onConnected = { runOnUiThread { render() } }
                  Dbg.log("session shuru -> $code")
                  c.startAsCaller(to, myCode, me)
                  // opor phone ghumiye ba kill thakle Google push diye jagai
                  db.collection("ids").document(code).get().addOnSuccessListener { s ->
                      val t = s.getString("token")
                      if (t != null) Push.wake(t) else Dbg.log("bondhur push token nei (se app ekbar open koreni)")
                  }
                  render()
                  return c
              }

              private fun prewarm() {
                  if (holding) return
                  val c = ensureSession(true)
                  if (c != null) {
                      handler.removeCallbacks(idleClose)
                      handler.postDelayed(idleClose, 60_000)
                  }
              }

              private fun startTalk(): Boolean {
                  val c = ensureSession(false) ?: return false
                  holding = true
                  handler.removeCallbacks(idleClose)
                  c.setTalking(true)
                  render()
                  return true
              }

              private fun stopTalk() {
                  holding = false
                  locked = false
                  call?.setTalking(false)
                  handler.removeCallbacks(idleClose)
                  handler.postDelayed(idleClose, 60_000)
                  render()
              }

              override fun onPause() {
                  super.onPause()
                  // lock kora kotha background e cholbe na
                  if (holding) stopTalk()
              }

              override fun onResume() {
                  super.onResume()
                  if (registered) prewarm()
              }

              override fun onDestroy() {
                  Dbg.sink = null
                  closeCall()
                  super.onDestroy()
              }
          }
