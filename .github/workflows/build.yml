          package com.walkietalk.app

          import android.os.Handler
          import android.os.Looper
          import com.google.firebase.auth.FirebaseAuth
          import org.json.JSONArray
          import org.json.JSONObject
          import org.webrtc.PeerConnection
          import java.net.HttpURLConnection
          import java.net.URL

          object Push {
              /** Opor phone ke Google push diye jagano (Cloudflare Worker hoye) */
              fun wake(targetToken: String) {
                  if (Cfg.PUSH_URL.isBlank() || Cfg.PUSH_URL.startsWith("__")) {
                      Dbg.log("push URL set kora nei")
                      return
                  }
                  val user = FirebaseAuth.getInstance().currentUser ?: return
                  user.getIdToken(false).addOnSuccessListener { r ->
                      Thread {
                          try {
                              val c = URL(Cfg.PUSH_URL).openConnection() as HttpURLConnection
                              c.requestMethod = "POST"
                              c.setRequestProperty("Authorization", "Bearer ${r.token}")
                              c.setRequestProperty("Content-Type", "application/json")
                              c.doOutput = true
                              c.connectTimeout = 8000
                              c.readTimeout = 8000
                              c.outputStream.use { it.write("""{"token":"$targetToken"}""".toByteArray()) }
                              val code = c.responseCode
                              val body = try {
                                  (if (code < 400) c.inputStream else c.errorStream).bufferedReader().readText().take(120)
                              } catch (_: Exception) { "" }
                              Dbg.log("push: $code $body")
                              c.disconnect()
                          } catch (e: Exception) {
                              Dbg.log("push fail: ${e.message}")
                          }
                      }.start()
                  }.addOnFailureListener { Dbg.log("idToken fail: ${it.message}") }
              }

              /** Cloudflare TURN er credential Worker theke ana. Na pele null (tokhon Metered fallback) */
              fun fetchIce(cb: (List<PeerConnection.IceServer>?) -> Unit) {
                  val main = Handler(Looper.getMainLooper())
                  if (Cfg.PUSH_URL.isBlank() || Cfg.PUSH_URL.startsWith("__")) { cb(null); return }
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null) { cb(null); return }
                  user.getIdToken(false).addOnSuccessListener { r ->
                      Thread {
                          try {
                              val c = URL(Cfg.PUSH_URL.trimEnd('/') + "/ice").openConnection() as HttpURLConnection
                              c.requestMethod = "POST"
                              c.setRequestProperty("Authorization", "Bearer ${r.token}")
                              c.setRequestProperty("Content-Type", "application/json")
                              c.doOutput = true
                              c.connectTimeout = 6000
                              c.readTimeout = 6000
                              c.outputStream.use { it.write("{}".toByteArray()) }
                              if (c.responseCode != 200) throw Exception("ice http ${c.responseCode}")
                              val txt = c.inputStream.bufferedReader().readText()
                              c.disconnect()
                              val v = JSONObject(txt).get("iceServers")
                              val arr = if (v is JSONArray) v else JSONArray().put(v)
                              val out = ArrayList<PeerConnection.IceServer>()
                              for (i in 0 until arr.length()) {
                                  val o = arr.getJSONObject(i)
                                  val u = o.get("urls")
                                  val urls = ArrayList<String>()
                                  if (u is JSONArray) {
                                      for (j in 0 until u.length()) urls.add(u.getString(j))
                                  } else {
                                      urls.add(u.toString())
                                  }
                                  val use = urls.filter { !it.contains(":53?") && !it.endsWith(":53") }
                                  if (use.isEmpty()) continue
                                  val b = PeerConnection.IceServer.builder(use)
                                  if (o.has("username")) b.setUsername(o.getString("username"))
                                  if (o.has("credential")) b.setPassword(o.getString("credential"))
                                  out.add(b.createIceServer())
                              }
                              main.post { cb(if (out.isEmpty()) null else out) }
                          } catch (e: Exception) {
                              Dbg.log("ice fail: ${e.message}")
                              main.post { cb(null) }
                          }
                      }.start()
                  }.addOnFailureListener { cb(null) }
              }
          }
