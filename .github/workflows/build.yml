              private fun confirmRemove(code: String) {
                  dlg()
                      .setTitle("Remove ${Store.nameOf(this, code) ?: code}?")
                      .setPositiveButton("Remove") { _, _ ->
                          Store.removeContact(this, code)
                          if (selected == code) { closeCall(); selected = null }
                          refreshChips()
                          render()
                          syncUp()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun inputBox(hintText: String, number: Boolean, max: Int, initial: String = ""): EditText =
                  EditText(this).apply {
                      hint = hintText
                      setText(initial)
                      inputType = if (number) InputType.TYPE_CLASS_NUMBER
                      else InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_CAP_WORDS
                      filters = arrayOf(InputFilter.LengthFilter(max))
                      textSize = 20f
                      gravity = Gravity.CENTER
                      setTextColor(INK)
                      setHintTextColor(SOFT)
                      backgroundTintList = ColorStateList.valueOf(SOFT)
                      setPadding(dp(24), dp(14), dp(24), dp(14))
                  }

              private fun showRenameDialog(code: String) {
                  val et = inputBox("Name", false, 20, Store.nameOf(this, code) ?: "")
                  dlg()
                      .setTitle("Rename $code")
                      .setView(et)
                      .setPositiveButton("Save") { _, _ ->
                          Store.setName(this, code, et.text.toString())
                          refreshChips()
                          render()
                          syncUp()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun showAddDialog() {
                  val etId = inputBox("6-digit friend ID", true, 6)
                  val etName = inputBox("Name (optional)", false, 20)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), 0)
                      addView(etId)
                      addView(etName)
                  }
                  dlg()
                      .setTitle("Add friend")
                      .setView(box)
                      .setPositiveButton("Add") { _, _ ->
                          addContact(etId.text.toString().trim(), etName.text.toString().trim())
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun addContact(code: String, name: String) {
                  if (code.length != 6) { toast("Enter a 6-digit ID"); return }
                  if (code == Store.myCode(this)) { toast("That's your own ID"); return }
                  db.collection("ids").document(code).get().addOnSuccessListener { s ->
                      val u = s.getString("uid")
                      if (u == null) {
                          toast("ID not found")
                      } else {
                          uidCache[code] = u
                          Store.addContact(this, code)
                          if (name.isNotBlank()) Store.setName(this, code, name)
                          refreshChips()
                          render()
                          syncUp()
                      }
                  }.addOnFailureListener { toast("Check your connection") }
              }

              /** Bondhur list + naam Firebase e save thake, reinstall korle ferot ashe */
              private fun syncUp() {
                  val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return
                  val code = Store.myCode(this) ?: return
                  val map = HashMap<String, String>()
                  for (c in Store.contacts(this)) map[c] = Store.nameOf(this, c) ?: ""
                  db.collection("users").document(uid).set(mapOf("code" to code, "contacts" to map))
                      .addOnFailureListener { Dbg.log("contacts sync fail: ${it.message}") }
              }

              private fun restoreContacts(then: (Boolean) -> Unit) {
                  val uid = FirebaseAuth.getInstance().currentUser?.uid
                  if (uid == null) { then(false); return }
                  db.collection("users").document(uid).get().addOnSuccessListener { s ->
                      val m = s.get("contacts") as? Map<*, *>
                      if (m != null) {
                          val have = Store.contacts(this)
                          for ((k, v) in m) {
                              val code = k as? String ?: continue
                              if (code !in have) Store.addContact(this, code)
                              val n = v as? String ?: ""
                              if (n.isNotBlank() && Store.nameOf(this, code) == null) Store.setName(this, code, n)
                          }
                      }
                      then(true)
                  }.addOnFailureListener { Dbg.log("contacts restore fail: ${it.message}"); then(false) }
              }

              private fun resolve(code: String, then: (() -> Unit)? = null) {
                  if (uidCache.containsKey(code)) { then?.invoke(); return }
                  db.collection("ids").document(code).get().addOnSuccessListener { s ->
                      val u = s.getString("uid")
                      if (u != null) { uidCache[code] = u; then?.invoke() }
                  }
              }

              // ------------------------------------------------------------ permissions / register
              private fun askPermissions() {
                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      need.add(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) requestPermissions(need.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, res: IntArray) {
                  super.onRequestPermissionsResult(code, perms, res)
              }

              private fun register() {
                  val auth = FirebaseAuth.getInstance()
                  if (auth.currentUser == null) {
                      DeviceAuth.signIn(this) { ok, err ->
                          if (ok) claim() else { fatal = "Login failed"; Dbg.log("login: $err"); render() }
                      }
                  } else claim()
              }

              private fun claim() {
                  val uid = FirebaseAuth.getInstance().currentUser?.uid ?: return
                  val existing = Store.myCode(this)
                  if (existing != null && Store.myUid(this) == uid) { ready(existing); return }
                  // reinstall korle purono ID ferot ana
                  db.collection("users").document(uid).get().addOnSuccessListener { s ->
                      val saved = s.getString("code")
                      if (saved != null) {
                          Dbg.log("purono ID ferot peyechi")
                          Store.setMy(this, saved, uid)
                          ready(saved)
                      } else {
                          tryClaim(uid, 0)
                      }
                  }.addOnFailureListener {
                      fatal = "Setup failed"
                      Dbg.log("users: ${it.message}")
                      render()
                  }
              }

              private fun tryClaim(uid: String, n: Int) {
                  if (n > 10) { fatal = "Could not get an ID"; render(); return }
                  val code = (100000 + Random.nextInt(900000)).toString()
                  val ref = db.collection("ids").document(code)
                  val userRef = db.collection("users").document(uid)
                  db.runTransaction(Transaction.Function<Any?> { t ->
                      if (t.get(ref).exists()) {
                          throw FirebaseFirestoreException("taken", FirebaseFirestoreException.Code.ABORTED)
                      }
                      t.set(ref, mapOf("uid" to uid))
                      t.set(userRef, mapOf("code" to code))
                      null
                  }).addOnSuccessListener {
                      Store.setMy(this, code, uid)
                      ready(code)
                  }.addOnFailureListener {
                      if (it is FirebaseFirestoreException && it.code == FirebaseFirestoreException.Code.ABORTED) {
                          tryClaim(uid, n + 1)
                      } else {
                          fatal = "Setup failed"
                          Dbg.log("claim: ${it.message}")
                          render()
                      }
                  }
              }

              private fun ready(code: String) {
                  registered = true
                  idChip.text = "ID  $code"
                  render()
                  restoreContacts { ok ->
                      refreshChips()
                      render()
                      if (ok) syncUp()
                  }
                  Incoming.start(applicationContext)
                  Rtc.ensureIce {}
                  checkUpdate()
                  if (Store.alwaysOn(this)) {
                      Incoming.serviceUp = true
                      try {
                          startForegroundService(Intent(this, WalkieService::class.java))
                      } catch (_: Exception) {
                          Incoming.serviceUp = false
                      }
                  }
                  FirebaseMessaging.getInstance().token
                      .addOnSuccessListener { t ->
                          db.collection("ids").document(code).update("token", t)
                              .addOnFailureListener { Dbg.log("token save fail: ${it.message}") }
                      }
                      .addOnFailureListener { Dbg.log("push token fail: ${it.message}") }
                  askBattery()
              }

              private fun askBattery() {
                  if (Store.batteryAsked(this)) return
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                      Store.setBatteryAsked(this)
                      try {
                          startActivity(
                              Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                  .setData(Uri.parse("package:$packageName"))
                          )
                      } catch (_: Exception) {}
                  }
              }

              // ------------------------------------------------------------ session / talk
              private fun closeCall() {
                  handler.removeCallbacks(idleClose)
                  handler.removeCallbacks(tick)
                  val c = call
                  call = null
                  callCode = null
                  holding = false
                  locked = false
                  c?.hangup()
                  render()
              }

              private fun ensureSession(quiet: Boolean): Call? {
                  val code = selected
                  if (code == null) return null
                  val to = uidCache[code]
                  if (to == null) {
                      resolve(code)
                      if (!quiet) toast("Checking ID, try again")
                      return null
                  }
                  val existing = call
                  if (existing != null && callCode == code && !existing.closed) return existing
                  val me = FirebaseAuth.getInstance().currentUser?.uid
                  val myCode = Store.myCode(this)
                  if (me == null || myCode == null) return null
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      if (!quiet) askPermissions()
                      return null
                  }
                  closeCall()
                  failed = false
                  sessionStart = System.currentTimeMillis()
                  val c = Call(applicationContext, db.collection("calls").document(), "caller")
                  call = c
                  callCode = code
                  c.onClosed = {
                      runOnUiThread {
                          if (call === c) {
                              call = null
                              callCode = null
                              holding = false
                              locked = false
                          }
                          render()
                      }
                  }
                  c.onConnected = { runOnUiThread { render() } }
                  Dbg.log("session shuru -> $code")
                  Rtc.ensureIce { c.startAsCaller(to, myCode, me) }
                  // opor phone ghumiye ba kill thakle Google push diye jagai
                  db.collection("ids").document(code).get().addOnSuccessListener { s ->
                      val t = s.getString("token")
                      if (t != null) Push.wake(t) else Dbg.log("bondhur push token nei (se app ekbar open koreni)")
                  }
                  render()
                  handler.removeCallbacks(tick)
                  handler.postDelayed(tick, 1000)
                  return c
              }

              private fun startTalk(): Boolean {
                  val c = ensureSession(false) ?: return false
                  holding = true
                  handler.removeCallbacks(idleClose)
                  c.setTalking(true)
                  render()
                  return true
              }

              private fun stopTalk() {
                  holding = false
                  locked = false
                  call?.setTalking(false)
                  handler.removeCallbacks(idleClose)
                  handler.postDelayed(idleClose, 60_000)
                  render()
              }

              override fun onStart() {
                  super.onStart()
                  Incoming.uiVisible = true
                  if (registered) {
                      Incoming.start(applicationContext)
                      checkUpdate()
                  }
              }

              override fun onStop() {
                  Incoming.uiVisible = false
                  Incoming.stopIfIdle()
                  super.onStop()
              }

              override fun onPause() {
                  super.onPause()
                  // lock kora kotha background e cholbe na
                  if (holding) stopTalk()
                  // kono bondhur sathe connected thakle, app theke berolew kotha cholbe (notification shoho)
                  if (Incoming.activeCount() > 0) {
                      try {
                          Incoming.serviceUp = true
                          startForegroundService(Intent(this, WalkieService::class.java))
                      } catch (_: Exception) {
                          Incoming.serviceUp = false
                      }
                  }
              }

              override fun onDestroy() {
                  Dbg.sink = null
                  closeCall()
                  super.onDestroy()
              }
          }
