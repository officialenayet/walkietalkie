          package com.walkietalk.app

          import android.content.Intent
          import com.google.firebase.firestore.FirebaseFirestore
          import com.google.firebase.messaging.FirebaseMessagingService
          import com.google.firebase.messaging.RemoteMessage

          class FcmService : FirebaseMessagingService() {
              override fun onNewToken(token: String) {
                  val code = Store.myCode(this) ?: return
                  FirebaseFirestore.getInstance().collection("ids").document(code).update("token", token)
              }

              override fun onMessageReceived(message: RemoteMessage) {
                  Dbg.log("push aslo")
                  // app khola thakle age thekei shunche, notification dorkar nei
                  if (Incoming.uiVisible && !Store.alwaysOn(this)) return
                  try {
                      Incoming.serviceUp = true
                      startForegroundService(Intent(this, WalkieService::class.java))
                  } catch (e: Exception) {
                      Incoming.serviceUp = false
                      Dbg.log("service start fail: ${e.message}")
                  }
              }
          }
